<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ if not .IsHome }}{{ .Title }}&mdash;{{ end }}grassmannian.info</title>

  <link rel="icon" type="image/png" href="/static/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/style.css">

  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      extensions: ['tex2jax.js'],
      jax: ['input/TeX', 'output/HTML-CSS'],
      TeX: {
        extensions: ['AMSmath.js', 'AMSsymbols.js'],
        Macros: {
          Gr: '\\operatorname{Gr}', LGr: '\\operatorname{LGr}',
          OGr: '\\operatorname{OGr}', SGr: '\\operatorname{SGr}'
        }
      },
      tex2jax: { inlineMath: [['$', '$']] },
      'HTML-CSS': { scale: 90, availableFonts: [] }
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js"></script>
</head>

<body>

<nav class="navbar navbar-dark bg-dark justify-content-center p-0" id="menu">
  <a class="nav-link py-2" href="/">Grassmannians</a>
  <a class="nav-link py-2" href="/horospherical/">horospherical varieties</a>
  <a class="nav-link py-2" href="/references/">references</a>
</nav>

<div id="title">
  <h1><a href="/"><span class="first-letters">Gr</span>assmannian.info</a></h1>
  <p id="slogan">A periodic table of (generalised) Grassmannians.</p>
</div>

<div class="container py-3" style="max-width: 1200px">
  {{ block "main" . }}{{ end }}
</div>

</body>
</html>
