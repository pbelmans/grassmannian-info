<div class="card mb-4">
  <div class="card-header">Betti numbers</div>
  <div class="card-body px-2" style="overflow-x: auto">
    <table class="mx-auto">
      <tbody>
      {{ range $i, $betti := . }}
        <tr>
          <td class="text-right pr-1">$\mathrm b_{ {{ mul 2 $i }} } =$</td>
          <td data-betti-degree="{{ mul 2 $i }}">{{ $betti }}</td>
        </tr>
      {{ end }}
      </tbody>
    </table>
  </div>
</div>
