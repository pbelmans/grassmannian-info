{% extends "page.html" %}
{% import "macros.html" as macros %}
{% block title %}References{% endblock %}
{% block content %}
<h2>References</h2>
<p>Chronological bibliography. Last updated on 28 October 2026.</p>

<p><label for="reference-topic">Topic</label>
<select id="reference-topic" class="ml-2">
  <option value="">all topics</option>
  {% for topic in references | map(attribute="topic") | unique | sort %}
  <option>{{ topic }}</option>
  {% endfor %}
</select></p>
{{ macros.bibliography(references, summaries=true) }}
<script>
document.getElementById("reference-topic").addEventListener("change", function () {
  document.querySelectorAll(".bibliography li").forEach(function (entry) {
    entry.hidden = !!this.value && entry.dataset.topic !== this.value;
  }, this);
});
</script>
{% endblock %}
