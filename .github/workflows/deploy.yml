name: Deploy Flask
on: workflow_dispatch
jobs:
  update:
    if: github.ref == 'refs/heads/flask'
    name: Update repository
    runs-on: ubuntu-latest
    steps:
    - name: git pull
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT }}
        script: |
          set -e
          cd grassmannian-info
          git fetch origin
          git switch flask
          git pull --ff-only origin flask

  reload:
    name: Reload website
    needs: update
    runs-on: ubuntu-latest
    steps:
    - name: touch WSGI
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT }}
        script: touch /var/www/www_grassmannian_info_wsgi.py
